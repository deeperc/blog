<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 880" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="760" height="880" fill="#ffffff"/>

  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">DeepERC pipeline: four bounded LLM call sites</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- ============ SPINE ============ -->
  <!-- input -->
  <rect x="70" y="58" width="330" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="235" y="83" text-anchor="middle" font-size="13" fill="#334155">KiCad netlist export (.net)</text>
  <line x1="235" y1="98" x2="235" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- parser -->
  <rect x="70" y="122" width="330" height="44" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="235" y="149" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Netlist parser (deterministic)</text>
  <line x1="235" y1="166" x2="235" y2="188" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- resolver -->
  <rect x="70" y="190" width="330" height="44" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="235" y="217" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Part resolver</text>
  <line x1="235" y1="234" x2="235" y2="301" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- extraction -->
  <rect x="70" y="303" width="330" height="44" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="235" y="330" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Specification extraction (per part, cached)</text>
  <line x1="235" y1="347" x2="235" y2="414" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- power inference -->
  <rect x="70" y="416" width="330" height="44" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="235" y="443" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Power-net inference</text>
  <line x1="235" y1="460" x2="235" y2="527" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- checks -->
  <rect x="70" y="529" width="330" height="52" rx="8" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <text x="235" y="551" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Seven check families</text>
  <text x="235" y="569" text-anchor="middle" font-size="11.5" fill="#334155">all verdicts deterministic</text>
  <line x1="235" y1="581" x2="235" y2="648" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- report -->
  <rect x="70" y="650" width="330" height="44" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="235" y="677" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Report builder</text>
  <line x1="235" y1="694" x2="235" y2="716" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- output -->
  <rect x="70" y="718" width="330" height="52" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="235" y="740" text-anchor="middle" font-size="12.5" fill="#334155">FAIL / WARN / PASS / UNRESOLVABLE</text>
  <text x="235" y="758" text-anchor="middle" font-size="12.5" fill="#334155">every finding carries an evidence label</text>

  <!-- ============ LLM SITE 1: resolver ============ -->
  <g>
    <rect x="470" y="178" width="250" height="40" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="489" cy="198" r="10" fill="#b45309"/>
    <text x="489" y="202" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
    <text x="612" y="202" text-anchor="middle" font-size="12" fill="#78350f">LLM: ambiguous part names</text>
    <line x1="400" y1="198" x2="466" y2="198" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="470" y="226" width="250" height="46" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
    <text x="595" y="245" text-anchor="middle" font-size="11" font-weight="600" fill="#064e46">guard: exact match against the</text>
    <text x="595" y="260" text-anchor="middle" font-size="11" font-weight="600" fill="#064e46">datasheets actually on disk</text>
    <path d="M 595 218 L 595 226" stroke="#047857" stroke-width="1.2"/>
    <path d="M 470 249 L 415 249 L 415 220 L 403 220" stroke="#047857" stroke-width="1.2" fill="none" marker-end="url(#arrg)"/>
  </g>

  <!-- ============ LLM SITE 2: extraction ============ -->
  <g>
    <rect x="470" y="291" width="250" height="40" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="489" cy="311" r="10" fill="#b45309"/>
    <text x="489" y="315" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
    <text x="612" y="315" text-anchor="middle" font-size="12" fill="#78350f">LLM: reads the datasheet</text>
    <line x1="400" y1="311" x2="466" y2="311" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="470" y="339" width="250" height="46" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
    <text x="595" y="358" text-anchor="middle" font-size="11" font-weight="600" fill="#064e46">guard: input validation + deterministic</text>
    <text x="595" y="373" text-anchor="middle" font-size="11" font-weight="600" fill="#064e46">completeness and plausibility scoring</text>
    <path d="M 595 331 L 595 339" stroke="#047857" stroke-width="1.2"/>
    <path d="M 470 362 L 415 362 L 415 333 L 403 333" stroke="#047857" stroke-width="1.2" fill="none" marker-end="url(#arrg)"/>
  </g>

  <!-- ============ LLM SITE 3: power ============ -->
  <g>
    <rect x="470" y="404" width="250" height="40" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="489" cy="424" r="10" fill="#b45309"/>
    <text x="489" y="428" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
    <text x="612" y="428" text-anchor="middle" font-size="12" fill="#78350f">LLM: ambiguous net names only</text>
    <line x1="400" y1="424" x2="466" y2="424" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="470" y="452" width="250" height="46" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
    <text x="595" y="471" text-anchor="middle" font-size="11" font-weight="600" fill="#064e46">guard: rule tier classifies first; every</text>
    <text x="595" y="486" text-anchor="middle" font-size="11" font-weight="600" fill="#064e46">rail tagged with its source, auditable</text>
    <path d="M 595 444 L 595 452" stroke="#047857" stroke-width="1.2"/>
    <path d="M 470 475 L 415 475 L 415 446 L 403 446" stroke="#047857" stroke-width="1.2" fill="none" marker-end="url(#arrg)"/>
  </g>

  <!-- ============ LLM SITE 4: explanations ============ -->
  <g>
    <rect x="470" y="638" width="250" height="40" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="489" cy="658" r="10" fill="#b45309"/>
    <text x="489" y="662" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
    <text x="612" y="662" text-anchor="middle" font-size="12" fill="#78350f">LLM: one explanation sentence</text>
    <line x1="400" y1="658" x2="466" y2="658" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="470" y="686" width="250" height="46" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
    <text x="595" y="705" text-anchor="middle" font-size="11" font-weight="600" fill="#064e46">guard: verdict, numbers, evidence label</text>
    <text x="595" y="720" text-anchor="middle" font-size="11" font-weight="600" fill="#064e46">already decided; prose changes nothing</text>
    <path d="M 595 678 L 595 686" stroke="#047857" stroke-width="1.2"/>
    <path d="M 470 709 L 415 709 L 415 680 L 403 680" stroke="#047857" stroke-width="1.2" fill="none" marker-end="url(#arrg)"/>
  </g>

  <!-- ============ LEGEND ============ -->
  <g>
    <rect x="70" y="800" width="150" height="26" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="145" y="817" text-anchor="middle" font-size="11" fill="#0f172a">deterministic stage</text>
    <rect x="240" y="800" width="150" height="26" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="315" y="817" text-anchor="middle" font-size="11" fill="#78350f">LLM call site</text>
    <rect x="410" y="800" width="230" height="26" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
    <text x="525" y="817" text-anchor="middle" font-size="11" fill="#064e46">deterministic bound on LLM output</text>
    <text x="70" y="852" font-size="11" fill="#64748b">No LLM output reaches a verdict without passing a deterministic check.</text>
  </g>
</svg>
